<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>新增学生</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
</head>
<body>
    <div class="form-container">
        <h2>新增学生</h2>

        <form method="POST" action="/student/insert?page={{ page }}">
            <div class="form-group">
                <label>学号</label>
                <input type="text" name="student_id" placeholder="请输入学号" required>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" name="student_name" placeholder="请输入姓名" required>
            </div>
            <div class="form-group">
                <label>学院</label>
                <input type="text" name="college" placeholder="请输入学院">
            </div>
            <div class="form-group">
                <label>性别</label>
                <select name="gender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>

            <button type="submit"> 提交</button>
        </form>

        <div class="back">
            <a href="/student/list?page={{ page }}">← 返回列表</a>
        </div>
    </div>
</body>
</html>
