<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>新增学生</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #3b52d4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #2a3fa8; }
        .back { text-align: center; margin-top: 15px; }
        .back a { color: #3b52d4; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>新增学生</h2>

        <form method="POST" action="/student/insert?page={{ page }}">
            <div class="form-group">
                <label>学号</label>
                <input type="text" name="student_id" placeholder="请输入学号" required>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" name="student_name" placeholder="请输入姓名" required>
            </div>
            <div class="form-group">
                <label>学院</label>
                <input type="text" name="college" placeholder="请输入学院">
            </div>
            <div class="form-group">
                <label>性别</label>
                <select name="gender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>

            <button type="submit"> 提交</button>
        </form>

        <div class="back">
            <a href="/student/list?page={{ page }}">← 返回列表</a>
        </div>
    </div>

<script>

</script>
</body>
</html>
