<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>账号注册</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
</head>
<body>
    <div class="form-container">
        <h2>管理员注册</h2>
        {% if message %}
        <div class="msg">{{ message }}</div>
        {% endif %}

        <form method="POST" action="/student/register">
            <div class="form-group">
                <label>账号</label>
                <input type="text" name="username" placeholder="设置登录账号" required>
            </div>
            <div class="form-group">
                <label>真实姓名</label>
                <input type="text" name="real_name" placeholder="填写真实姓名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="设置密码" required>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="password2" placeholder="再次输入密码" required>
            </div>
            <button type="submit">注册</button>
        </form>

        <div class="tip">
            已有账号？<a href="/student/login">返回登录</a>
        </div>
    </div>
</body>
</html>
