<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改学生信息</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>修改学生信息</h2>
        <form method="POST" action="/student/update?page={{ page }}">
            <input type="hidden" name="student_id" value="{{ student[0] }}">

            <div class="form-group">
                <label>学号</label>
                <span>{{ student[0] }}</span>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" name="student_name" value="{{ student[1] or '' }}" placeholder="请输入姓名" >
            </div>

            <div class="form-group">
                <label>学院</label>
                <input type="text" name="college" value="{{ student[2] or '' }}" placeholder="请输入学院">
            </div>
            <div class="form-group">
                <label>性别</label>
                <select name="gender">
                    <option value="男" {% if student[3] == '男' %}selected{% endif %}>男</option>
                    <option value="女" {% if student[3] == '女' %}selected{% endif %}>女</option>
                </select>
            </div>
            <div class="form-group">
                <label>选课情况</label>
                <span>{{ student[4] }}</span>
            </div>

            <button type="submit"> 提交</button>
        </form>
    </div>
</body>
</html>
