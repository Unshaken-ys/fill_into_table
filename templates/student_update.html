<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改学生信息</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
</head>
<body>
    <div class="form-container">
        <h2>修改学生信息</h2>
        <form method="POST" action="/student/update?page={{ page }}">
            <input type="hidden" name="student_id" value="{{ student[0] }}">

            <div class="form-group">
                <label>学号</label>
                <span>{{ student[0] }}</span>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" name="student_name" value="{{ student[1] or '' }}" placeholder="请输入姓名" >
            </div>

            <div class="form-group">
                <label>学院</label>
                <input type="text" name="college" value="{{ student[2] or '' }}" placeholder="请输入学院">
            </div>
            <div class="form-group">
                <label>性别</label>
                <select name="gender">
                    <option value="男" {% if student[3] == '男' %}selected{% endif %}>男</option>
                    <option value="女" {% if student[3] == '女' %}selected{% endif %}>女</option>
                </select>
            </div>
            <div class="form-group">
                <label>选课情况</label>
                <span>{{ student[4] }}</span>
            </div>

            <button type="submit" class="btn-save"> 提交</button>
        </form>
    </div>
</body>
</html>
